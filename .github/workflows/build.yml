name: build

# PHA-3074 verification pipeline. Runs `./build.sh` on every push and PR
# against a clean Ubuntu runner that has the Android toolchain available
# natively (no rustup-on-the-fly, no sdkmanager-on-the-fly).
#
# The build.sh script is the canonical entrypoint; this workflow is just
# the runner plumbing. When this turns green, the deliverable
# "build.sh produces app-debug.apk on a clean machine" is verified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Run on the Ubuntu 24.04 hosted runner; PHA-3074 README pins this.
    runs-on: ubuntu-24.04

    # Bound the workflow runtime — `build.sh` downloads Android SDK ~1GB
    # plus NDK + platform tools. The default 360-minute cap is generous.
    timeout-minutes: 60

    env:
      # Reproducible pins — README's "Pinned toolchain versions" table.
      NDK_VERSION: "27.0.12077973"
      ANDROID_PLATFORM: "android-34"
      # Google's cmdline-tools zip is keyed by an opaque build id, not the
      # platform name — see https://developer.android.com/studio#command-line-tools-only.
      CMDLINE_TOOLS_BUILD: "11076708"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Pull the full tsclientlib@ee3bc6f history (1MB), nothing more.
          fetch-depth: 0

      - name: Set ANDROID_HOME
        # env: only allows github/needs/vars/strategy/matrix/secrets/inputs
        # contexts, not runner — so runner.temp has to be resolved in a step.
        run: echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Rust 1.78+ supports the workspace-local CLI shim pattern.

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends \
            unzip ca-certificates pkg-config libopus-dev libasound2-dev
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          cd "${ANDROID_HOME}/cmdline-tools"
          curl -sSLo tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip"
          unzip -q tools.zip
          mkdir -p latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt \
            cmdline-tools/source.properties latest/ 2>/dev/null || true
          rm -f tools.zip

      - name: Accept SDK licenses + install NDK + platform + build-tools
        run: |
          set -e
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;${NDK_VERSION}" \
                     "platforms;${ANDROID_PLATFORM}" \
                     "build-tools;35.0.0"

      - name: Build with build.sh
        run: |
          # build.sh will:
          #  1. Install Rust targets aarch64-linux-android + x86_64-linux-android
          #  2. Install cargo-ndk 4.1.0 + uniffi_bindgen-cli (skipped — we have the shim)
          #  3. Generate UniFFI Kotlin bindings (workspace shim with fallback)
          #  4. Cross-compile plnt-core for both targets
          #  5. Run ./gradlew --no-daemon assembleDebug
          #  6. Verify app-debug.apk exists
          chmod +x ./build.sh
          ./build.sh

      - name: "Smoke: APK present"
        run: |
          ls -la app/app/build/outputs/apk/debug/app-debug.apk
          file app/app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/app/build/outputs/apk/debug/app-debug.apk | head -30

      - name: "Smoke: jniLibs contains the right .so files"
        run: |
          ls -la app/app/src/main/jniLibs/aarch64-linux-android/
          ls -la app/app/src/main/jniLibs/x86_64-linux-android/

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plnt-app-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
